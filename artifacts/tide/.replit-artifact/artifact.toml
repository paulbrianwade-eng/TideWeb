kind = "web"
previewPath = "/tide/"
title = "TIDE"
version = "1.0.0"
id = "artifacts/tide"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/tide/" ]
localPort = 22078

[services.development]
run = "pnpm --filter @workspace/tide run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tide", "run", "build" ]
publicDir = "artifacts/tide/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22078"
BASE_PATH = "/tide/"
